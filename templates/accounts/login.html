<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - KPIMaster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-body">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card border-0">
                    <div class="login-header">
                        <div class="login-logo">
                            <i class="bi bi-speedometer2"></i>
                        </div>
                        <h4 class="fw-bold text-dark mb-1">KPIMaster</h4>
                        <p class="text-muted small mb-0">Daily Work & Performance Platform</p>
                    </div>

                    <div class="card-body p-4 bg-white">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags|default:'danger' }} small py-2" role="alert">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST" action="{% url 'login' %}">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="username" class="form-label small fw-semibold text-secondary">Username or Employee Code</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" name="username" id="username" class="form-control border-start-0 ps-0" placeholder="Enter username or ID" required autofocus>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="password" id="password" class="form-control border-start-0 ps-0" placeholder="Enter password" required>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="remember_me" id="rememberMe">
                                    <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                                </div>
                                <span class="badge bg-light text-secondary border">Asia/Dhaka</span>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Secure Sign In
                            </button>
                        </form>
                    </div>

                    <div class="card-footer bg-light text-center py-3 border-0">
                        <p class="text-muted mb-0" style="font-size: 0.75rem;">
                            Enterprise Performance Management &copy; 2026 (<a href="https://www.alamhossain.com" class="text-decoration-none text-muted">ALAM</a>)<br>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
